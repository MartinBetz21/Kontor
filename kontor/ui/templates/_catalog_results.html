<div class="catalog-results">{% for i in items %}
<button type="button" data-catalog='{{ {"title": i.title, "description": i.description, "unit": i.unit, "price": i.unit_price|money_input, "tax_rate": i.tax_rate}|tojson|forceescape }}'>{{ i.title }} · {{ i.unit_price|eur }} / {{ i.unit }}</button>
{% else %}<p class="muted">Keine Standardposition gefunden.</p>{% endfor %}</div>
